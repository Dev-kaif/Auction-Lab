[project]
name = "auctionlab-backend"
version = "0.1.0"
description = "AuctionLab: first-price and second-price advertisement auction simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
